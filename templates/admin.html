{% extends "base.html" %}
{% block content %}
<section class="glass rounded-md p-5">
  <div class="mb-5 flex items-center justify-between">
    <h1 class="text-2xl font-semibold">管理后台</h1>
    <div class="flex gap-2">
      <a href="/admin/dimensions" class="rounded border border-slate-700 px-4 py-2 text-sm">维度定义</a>
      <a href="/admin/entertainment-logs" class="rounded border border-slate-700 px-4 py-2 text-sm">娱乐日志</a>
      <a href="/admin/template/new" class="rounded bg-cyan-400 px-4 py-2 text-sm font-semibold text-slate-950">新建模板</a>
    </div>
  </div>
  <div class="space-y-3">
    {% for tpl in templates %}
      <div class="panel flex items-center justify-between rounded-md p-4">
        <div><div class="font-semibold">{{ tpl.name }}</div><div class="text-sm text-slate-500">{{ tpl.category }} · {{ "启用" if tpl.is_active else "停用" }}</div></div>
        <div class="flex gap-2">
          <a class="rounded border border-slate-700 px-3 py-2 text-sm" href="/admin/template/{{ tpl.id }}/edit">编辑</a>
          <form method="post" action="/admin/template/{{ tpl.id }}/toggle"><button class="rounded border border-slate-700 px-3 py-2 text-sm">切换</button></form>
        </div>
      </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
