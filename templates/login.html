{% extends "base.html" %}
{% block content %}
<section class="auth-page">
  <section class="auth-card">
    <div class="auth-card-head">
      <span class="auth-kicker">AutoCut Engine</span>
      <h1>{{ "注册" if mode == "register" else "登录" }}</h1>
      <p>进入你的剪辑工作台</p>
    </div>
    <form method="post" action="{{ '/register' if mode == 'register' else '/login' }}" class="auth-form">
      <input type="hidden" name="next_url" value="{{ next_url or '/' }}">
      <label class="auth-field">
        <span>账号</span>
        <input name="username" required autocomplete="username" class="auth-input">
      </label>
      <label class="auth-field">
        <span>密码</span>
        <input name="password" type="password" required autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}" class="auth-input">
      </label>
      <button class="auth-button" type="submit">{{ "创建账号" if mode == "register" else "进入工作台" }}</button>
    </form>
    <p class="auth-switch">
      {% if mode == "register" %}<a href="/login?{{ next_query }}">已有账号，去登录</a>{% else %}<a href="/register?{{ next_query }}">注册新账号</a>{% endif %}
    </p>
  </section>
</section>
{% endblock %}
