{% extends "base.html" %}
{% block content %}
<form method="post" action="/creative/create" enctype="multipart/form-data" class="mx-auto max-w-4xl soft-card p-7">
  <div class="mb-7">
    <h1 class="page-title font-black text-white">提交专家剪辑经验</h1>
    <p class="mt-3 text-base font-semibold leading-7 text-slate-500">这里不是普通发作品，而是把“怎么剪、为什么这么剪、适合什么场景”存入数据库。系统会把描述解析成维度配置，后续可由管理员沉淀为新模板。</p>
  </div>

  <div class="grid gap-5">
    <label class="grid gap-2 text-sm font-bold text-slate-400">经验标题
      <input name="title" required placeholder="例如：压迫感战斗段落的节奏加速和音效铺底" class="rounded-xl border border-slate-800 bg-slate-950 px-4 py-3 text-slate-100">
    </label>
    <label class="grid gap-2 text-sm font-bold text-slate-400">剪辑方法描述
      <textarea name="description" rows="9" required placeholder="请尽量写清楚：适用场景、节奏、转场、调色、音效、字幕/道具/表情怎么处理。比如：高潮前先保留0.5秒静默，角色冲出时加速到1.3倍，叠加气流声和低频冲击..." class="rounded-xl border border-slate-800 bg-slate-950 px-4 py-3 leading-7 text-slate-100"></textarea>
    </label>

    <div class="grid gap-5 md:grid-cols-2">
      <label class="grid gap-2 text-sm font-bold text-slate-400">原片，可选
        <input type="file" name="original_video" accept="video/*" class="rounded-xl border border-slate-800 bg-slate-950 p-3">
      </label>
      <label class="grid gap-2 text-sm font-bold text-slate-400">成片/效果参考，可选
        <input type="file" name="result_video" accept="video/*" class="rounded-xl border border-slate-800 bg-slate-950 p-3">
      </label>
    </div>
  </div>

  <div class="mt-7 flex flex-wrap items-center gap-4">
    <button class="gradient-action rounded-xl px-7 py-3 text-base font-black">保存到专家经验库并分析</button>
    <a href="/creative" class="text-sm font-bold text-slate-600 hover:text-slate-300">返回创意坊</a>
  </div>
</form>
{% endblock %}
